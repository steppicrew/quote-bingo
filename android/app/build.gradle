apply plugin: 'com.android.application'

// Version is owned by package.json — `yarn version:bump` is the single place
// that moves it, so the web app, the .aab and the release notes never drift.
def packageJson = new groovy.json.JsonSlurper().parseText(
    file('../../package.json').text
)
def appVersionName = packageJson.version
def appVersionCode = packageJson.androidVersionCode as Integer

// Release signing is opt-in: android/keystore.properties is gitignored and
// written by scripts/build-android.sh from .env. Without it the release build
// simply stays unsigned (still fine for a local `assemble`).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "de.steppicrew.quotebingo"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.steppicrew.quotebingo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        // Own id, so a debug build installs NEXT TO the Play version: the
        // signatures differ, and replacing it would mean uninstalling — which
        // wipes the board data on the test phone.
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    // Predictable output name so the build script can find the artefact.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (output.outputFileName?.endsWith('.apk')) {
                output.outputFileName = "quote-bingo-${variant.name}-${appVersionName}.apk"
            }
        }
    }
}

// The debug build installs next to the Play version (applicationIdSuffix), so
// the launcher must tell them apart: "[P] " before the name in every locale.
// Derived from main's strings.xml, which gen-assets.mjs writes per locale,
// rather than a hand-kept copy that would drift from it.
def previewRes = layout.buildDirectory.dir('generated/preview-res').get().asFile
def mainRes = file('src/main/res')
mainRes.eachDirMatch(~/values(-.+)?/) { dir ->
    def strings = new File(dir, 'strings.xml')
    if (!strings.exists()) return
    def labels = new groovy.xml.XmlSlurper().parse(strings).string.findAll {
        it.@name == 'app_name' || it.@name == 'title_activity_main'
    }
    if (labels.isEmpty()) return
    def out = new File(previewRes, "${dir.name}/strings.xml")
    out.parentFile.mkdirs()
    out.text = "<?xml version='1.0' encoding='utf-8'?>\n<resources>\n" +
        labels.collect {
            "    <string name=\"${it.@name}\">[P] ${groovy.xml.XmlUtil.escapeXml(it.text())}</string>\n"
        }.join('') +
        "</resources>\n"
}
android.sourceSets.debug.res.srcDirs += previewRes

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // EdgeToEdge (MainActivity); Capacitor pulls it in but not onto our classpath.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
